{% extends 'juegos/base.html' %}

{% block title %}Eliminar Juego{% endblock %}

{% block content %}
<h2>Eliminar Juego</h2>

<div class="alert alert-warning">
    <p>¿Está seguro que desea eliminar este juego?</p>
    <p><strong>{{ juego.titulo }}</strong> - {{ juego.genero }} ({{ juego.anio }})</p>
</div>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Eliminar</button>
    <a href="{% url 'lista_juegos' %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
